# Build wheels (cibuildwheel) and sdist on every change to the build inputs.
# On a published release, also upload them to PyPI via Trusted Publishing.

name: Build Wheels and Publish

on:
  release:
    types: [published]
  push:
    branches: [ "master", "v1/main" ]
    paths: &build-paths
      - "pyproject.toml"
      - "similaripy/**"
      - "tests/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pypi-publish.yml"
  pull_request:
    paths: *build-paths
  workflow_dispatch:

# A new push cancels the outdated run of the same branch / PR; release runs are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: the last Intel image (no "latest" label for Intel)
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]

    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        # macOS/Windows build on the host: explicit, so a runner image with a
        # half-installed pin (rustup: "detected conflict: bin/cargo-clippy") is
        # cleaned up and retried once instead of failing inside the build. Linux
        # builds in the manylinux container, which installs rustup itself.
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rustup toolchain install || {
            rustup toolchain uninstall "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
            rustup toolchain install
          }

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.1
        env:
          # PRs build one Python (GIL + free-threaded) per platform; pushes and releases build all
          CIBW_BUILD: ${{ github.event_name == 'pull_request' && 'cp314-* cp314t-*' || '*' }}

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build source distribution
        run: |
          rm -rf dist
          python -m build --sdist

      - name: Validate metadata
        run: |
          twine check dist/*.tar.gz

      - name: Install and test from sdist
        run: |
          python -m venv testenv
          source testenv/bin/activate
          pip install dist/*.tar.gz
          pip install pytest
          pytest

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    name: Upload to PyPI
    if: github.event_name == 'release'
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches package version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "Tag $GITHUB_REF_NAME does not match version v$VERSION"; exit 1; }

      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          skip-existing: true
