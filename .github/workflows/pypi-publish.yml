# Build wheels (cibuildwheel) and sdist on every change to the build inputs.
# On a published release, also upload them to PyPI via Trusted Publishing.

name: Build Wheels and Publish

on:
  release:
    types: [published]
  push:
    branches: [ "master", "v1/main" ]
    paths: &build-paths
      - "pyproject.toml"
      - "similaripy/**"
      - "tests/**"
      - "crates/**"
      # The internal server isn't in the wheel (its Cargo.lock changes still match)
      - "!crates/similaripy-server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".github/workflows/pypi-publish.yml"
      - ".github/actions/rust-toolchain/**"
  pull_request:
    paths: *build-paths
  workflow_dispatch:

# A new push cancels the outdated run of the same branch / PR; release runs are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

# Read-only token unless a job asks for more
permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    # Not for a server release (tags server-v*, server-release.yml); publish
    # needs this job, so it's skipped too
    if: ${{ !startsWith(github.event.release.tag_name, 'server-v') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: the last Intel image (no "latest" label for Intel). Not on
        # PRs: the slowest job (~5 min); pushes and releases build it as before.
        os: ${{ fromJSON(github.event_name == 'pull_request'
          && '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "macos-latest"]'
          || '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "macos-latest", "macos-15-intel"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        # macOS/Windows build on the host; Linux builds in the manylinux
        # container, which installs rustup itself (pyproject.toml before-all)
        if: runner.os != 'Linux'
        uses: ./.github/actions/rust-toolchain

      - name: Build and test wheels
        uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        env:
          # PRs build one Python (GIL + free-threaded) per platform; pushes and releases build all
          CIBW_BUILD: ${{ github.event_name == 'pull_request' && 'cp314-* cp314t-*' || '*' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    if: ${{ !startsWith(github.event.release.tag_name, 'server-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install the pinned toolchain
        # maturin's sdist runs cargo metadata
        uses: ./.github/actions/rust-toolchain

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build source distribution
        run: |
          rm -rf dist
          python -m build --sdist

      - name: Validate metadata
        run: |
          twine check dist/*.tar.gz

      - name: Install and test from sdist
        run: |
          python -m venv testenv
          source testenv/bin/activate
          pip install dist/*.tar.gz
          python -m pip install --upgrade pip  # --group needs pip >= 25.1
          pip install --group test
          pytest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    name: Upload to PyPI
    if: github.event_name == 'release'
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches package version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "Tag $GITHUB_REF_NAME does not match version v$VERSION"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
