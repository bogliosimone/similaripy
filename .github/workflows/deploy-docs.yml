name: Deploy MkDocs Documentation

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          pip install uv

      - name: Install the docs tools
        # mkdocstrings reads the sources statically: no package build, no Rust
        run: |
          uv pip install --system --group docs

      - name: Deploy documentation
        # Pages serves the gh-pages branch: build, then push site/ there
        run: |
          zensical build --strict
          ghp-import -n -p -f site
