# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Build and Test

on:
  push:
    branches: [ "master", "v1/main" ]
  pull_request:

# A new push cancels the outdated run of the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # A runner-side failure (e.g. a broken rustup install) shouldn't cancel the other 14 jobs
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the pinned toolchain
      # Explicit, so a runner image with a half-installed pin (rustup: "detected
      # conflict: bin/cargo-clippy") is cleaned up and retried once instead of
      # failing inside `pip install .`
      shell: bash
      run: |
        rustup toolchain install || {
          rustup toolchain uninstall "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install
        }

    - name: Build and install the package
      run: |
        python -m pip install --upgrade pip
        python -m pip install .

    - name: Lint with flake8
      run: |
        python -m pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests
      run: |
        python -m pip install pytest
        pytest

  minimum-versions:
    # The dependency floors in pyproject.toml, on the oldest Python: lowest-direct
    # takes the lowest numpy/scipy allowed. No --only-binary on purpose: a floor
    # with no wheel for this Python should fail here, not resolve higher.
    name: Minimum versions (Python 3.11)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install the pinned toolchain
      shell: bash
      run: |
        rustup toolchain install || {
          rustup toolchain uninstall "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install
        }

    - name: Install the package with the lowest allowed dependencies
      run: |
        python -m pip install uv
        uv pip install --system --resolution lowest-direct . "pytest>=8"
        python -c "import numpy, scipy; print('numpy', numpy.__version__, 'scipy', scipy.__version__)"

    - name: Run tests
      run: pytest

  rust:
    name: Rust core (fmt, clippy, test)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install the pinned toolchain
      # Runner images ship rustup; no args = install what rust-toolchain.toml says
      run: rustup toolchain install

    - name: Check formatting
      run: cargo fmt --check

    - name: Lint with clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Run tests
      run: cargo test --workspace
