name: Build and Test

on:
  push:
    branches: [ "master", "v1/main" ]
  pull_request:

# A new push cancels the outdated run of the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token unless a job asks for more
permissions:
  contents: read

jobs:
  build:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # A runner-side failure (e.g. a broken rustup install) shouldn't cancel the other 14 jobs
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the pinned toolchain
      # Explicit, so a runner image with a half-installed pin (rustup: "detected
      # conflict: bin/cargo-clippy") is cleaned up and retried once instead of
      # failing inside `pip install .`
      shell: bash
      run: |
        rustup toolchain install || {
          rustup toolchain uninstall "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install
        }

    - name: Build and install the package
      run: |
        python -m pip install --upgrade pip
        python -m pip install .

    - name: Run tests
      run: |
        python -m pip install --group test
        pytest

  minimum-versions:
    # The dependency floors in pyproject.toml, on the oldest Python: lowest-direct
    # takes the lowest numpy/scipy allowed. No --only-binary on purpose: a floor
    # with no wheel for this Python should fail here, not resolve higher.
    # The build backend (maturin) is not covered: uv builds with the latest.
    name: Minimum versions (Python 3.11)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install the pinned toolchain
      shell: bash
      run: |
        rustup toolchain install || {
          rustup toolchain uninstall "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install
        }

    - name: Install the package with the lowest allowed dependencies
      run: |
        python -m pip install uv
        uv pip install --system --resolution lowest-direct .
        uv pip install --system --group test
        python -c "import numpy, scipy; print('numpy', numpy.__version__, 'scipy', scipy.__version__)"

    - name: Run tests
      run: pytest

  lint:
    # The pinned ruff and ty from the lint dependency group; no package build
    name: Lint (ruff, ty)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install uv
      run: python -m pip install uv

    - name: Lint with ruff
      run: uv run --only-group lint ruff check

    - name: Type check with ty
      # uv check runs the lint group's ty on numpy/scipy, without building the package
      run: uv check --no-install-project --group lint --preview-features check-command

  rust:
    name: Rust core (fmt, clippy, test)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install the pinned toolchain
      # Runner images ship rustup; no args = install what rust-toolchain.toml says.
      # One retry after cleaning up a half-installed pin, as in the other jobs
      shell: bash
      run: |
        rustup toolchain install || {
          rustup toolchain uninstall "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install
        }

    - name: Check formatting
      run: cargo fmt --check

    - name: Lint with clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Run tests
      run: cargo test --workspace
