# Monthly PRs for new GitHub Action releases and Rust crate versions.
# Not the Rust toolchain: rust-toolchain.toml stays a manual, benchmarked bump.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Skip releases younger than a week (a bad or compromised release is usually
    # pulled by then); security updates bypass it
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # A PyO3 / numpy / rayon bump can change the kernel's machine code: check the
  # "Codegen-sensitive hot loops" in tests/benchmarks/README.md before merging.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      # Own PR: bindings bumps get the codegen check (and often source changes)
      bindings:
        patterns: ["pyo3*", "numpy"]
      cargo:
        patterns: ["*"]
