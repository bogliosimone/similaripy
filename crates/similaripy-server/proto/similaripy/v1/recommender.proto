// The server's gRPC contract (server plan S4 P1, S5b). The same requests and
// answers as `POST /v1/recommend` and `POST /v1/score` (JSON), with the same
// defaults and limits.
// The request id: `x-request-id` metadata in (kept if 1-128 printable ASCII
// bytes, else generated) and out, and in the answer. Field numbers are never
// reused.
syntax = "proto3";

package similaripy.v1;

service Recommender {
  rpc Recommend(RecommendRequest) returns (RecommendResponse);
  // The scores of given items for one history (e.g. a ranker's feature for
  // other retrievers' candidates): the same bits as Recommend's score.
  rpc Score(ScoreRequest) returns (ScoreResponse);
}

// A list whose presence matters: absent = no filter, empty = nothing.
message IdList {
  repeated int64 ids = 1;
}

// Unknown fields are ignored (protobuf's rule; JSON rejects them).
message RecommendRequest {
  // The user's history, oldest -> newest; unknown ids are ignored.
  repeated int64 history = 1;
  // One per history id; empty = unweighted (proto3 can't tell empty from absent).
  repeated float weights = 2;
  // Default 10.
  optional uint32 k = 3;
  // Default true.
  optional bool exclude_seen = 4;
  // Absent = every item; an empty list = no item.
  IdList include = 5;
  repeated int64 exclude = 6;
  // Default true: by score, descending.
  optional bool sorted = 7;
  // A named view (`GET /v1/views`): absent = the `defaults.view` config key;
  // "" = the whole model; an unknown name = INVALID_ARGUMENT. ANDed with
  // include / exclude.
  optional string view = 8;
  // More named views, ANDed with `view` (absent: `defaults.view`; "": none)
  // and include / exclude: an item must be allowed by every one. At most 8
  // (more = INVALID_ARGUMENT, x-error-code too_many_views); an unknown name =
  // INVALID_ARGUMENT (unknown_view).
  repeated string views = 9;
}

// Fixed-width ids: encoding them is a copy (varint int64 cost 7 us more at
// k 2000). The rest is the request's context, as in the JSON answer.
message RecommendResponse {
  repeated sfixed64 ids = 1;
  repeated float scores = 2;
  ModelInfo model = 3;
  string request_id = 4;
  // The k and sorted used (defaults applied).
  uint32 k = 5;
  bool sorted = 6;
  // The view used; absent = the whole model.
  optional string view = 7;
  History history = 8;
  // The request's views, as sent.
  repeated string views = 9;
}

// Which model answered.
message ModelInfo {
  // The `model.name` config key (default: the model directory's name).
  string name = 1;
}

// The request's history ids: `sent` = as sent; `truncated` = the oldest cut
// past `limits.max_history`; `unknown` = ids the model doesn't have among
// the rest (per occurrence; ignored).
message History {
  uint64 sent = 1;
  uint64 truncated = 2;
  uint64 unknown = 3;
}

// Unknown fields are ignored (protobuf's rule; JSON rejects them).
message ScoreRequest {
  // As RecommendRequest's (cut past `limits.max_history` the same way).
  repeated int64 history = 1;
  // One per history id; empty = unweighted.
  repeated float weights = 2;
  // The items to score, at most `limits.max_items` (more = INVALID_ARGUMENT,
  // never cut); duplicates are scored again.
  repeated int64 items = 3;
  // As RecommendRequest's: the view's excluded items score 0.
  optional string view = 4;
  // As RecommendRequest's: an item any of them excludes scores 0.
  repeated string views = 5;
}

message ScoreResponse {
  // One per requested item, in its order: 0 for an item the model doesn't
  // have (or has no column for) or the view excludes; zero and negative
  // scores as they are.
  repeated float scores = 1;
  ModelInfo model = 2;
  string request_id = 3;
  // The view used; absent = the whole model.
  optional string view = 4;
  History history = 5;
  // The request's views, as sent.
  repeated string views = 6;
}
