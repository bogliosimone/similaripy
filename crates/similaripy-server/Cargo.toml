[package]
name = "similaripy-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Internal design validator for the serving core (server plan S2): not in the
# wheel, not released
publish = false

[lints]
workspace = true

[dependencies]
similaripy-core = { path = "../similaripy-core" }
axum = { version = "0.8.9", default-features = false }
bytes = "1.11"
http-body-util = "0.1.3"
hyper = { version = "1.12", features = ["client", "http1", "http2", "server"] }
# server-auto: HTTP/1.1 (JSON) or h2c (gRPC) per connection, by its preface
hyper-util = { version = "0.1.21", features = ["service", "tokio", "server-auto", "http1", "http2"] }
prost = "0.14.6"
serde = { version = "1.0.228", features = ["derive"] }
# float_roundtrip: correctly rounded f64 parsing (the default fast path can be
# 1 ULP off), so a weight parses to the same f32 as numpy's float32(json float)
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tokio = { version = "1.54", features = ["net", "rt", "rt-multi-thread", "sync", "time"] }
# router: the gRPC service inside the axum Router; transport: loadgen's client
tonic = { version = "0.14.9", default-features = false, features = ["codegen", "router", "transport"] }
tonic-prost = "0.14.9"

[build-dependencies]
# protox: .proto compiled in Rust (no protoc on dev machines or CI)
protox = "0.10.0"
tonic-prost-build = { version = "0.14.9", default-features = false, features = ["transport"] }

# Thread QoS on macOS (P-cores for the server, E-cores for loadgen on a
# laptop); process CPU time (getrusage) for /metrics
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
