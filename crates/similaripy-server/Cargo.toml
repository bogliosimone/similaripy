[package]
name = "similaripy-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Internal design validator for the serving core (server plan S2): not in the
# wheel, not released
publish = false

[lints]
workspace = true

[dependencies]
similaripy-core = { path = "../similaripy-core" }
axum = { version = "0.8.9", default-features = false }
bytes = "1.11"
http-body-util = "0.1.3"
hyper = { version = "1.12", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
# float_roundtrip: correctly rounded f64 parsing (the default fast path can be
# 1 ULP off), so a weight parses to the same f32 as numpy's float32(json float)
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tokio = { version = "1.54", features = ["net", "rt", "rt-multi-thread", "sync", "time"] }

# Thread QoS (P-cores for the server, E-cores for loadgen on a laptop)
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.190"
