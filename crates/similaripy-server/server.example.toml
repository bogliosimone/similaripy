# similaripy-server config: every key with its default.
# Use: similaripy-server --config server.toml
# Each key can also be an env var (SIMILARIPY_LIMITS__K_MAX=500) or a flag
# (--limits.k_max 500); flag > env > file > default. An unknown key stops the
# server at start. --print-config prints the resolved config and exits.
# Docs: https://bogliosimone.github.io/similaripy/server/
# Relative file paths are relative to the server's working directory.

[model]
# A SparseKNN.save directory (required).
path = "models/v3"
# Map the model's files (one copy shared by every process on the machine);
# false = read them into memory.
mmap = true
# Returned in every answer, to tell model versions apart. Default: the
# directory's name.
# name = "itemknn-2026-11-16"

[server]
# host:port to listen on (JSON and gRPC on the same port).
addr = "127.0.0.1:8080"
# Server threads, one request at a time each. Default: P-cores (macOS),
# available CPUs (Linux, container CPU limit included).
# threads = 4
# Column block size: "auto", "off" or entries per block.
block_size = "auto"

[limits]
# A larger k is rejected (400 k_over_max).
k_max = 2000
# History ids a request uses.
max_history = 1000
# A longer history: "truncate" (keep the last max_history ids) or "reject"
# (400 history_over_max).
history_policy = "truncate"
# A larger request body is rejected (JSON 413, gRPC OUT_OF_RANGE): about 100k
# ids per MiB in JSON; raise it for a large include.
max_body_bytes = 1048576
# A score request with more items is rejected, never cut.
max_items = 10000
# Open connections; at the cap new ones wait (OS backlog) until one closes.
max_connections = 1024

[defaults]
# What a request gets for a field it doesn't send.
# k (at most limits.k_max): e.g. 500 for candidate generation.
k = 10
# false = the same items in no order (retrieval: a ranker re-scores them),
# cheaper at large k, as Python's default; true = best first.
sorted = false

[timeouts]
# Seconds a connection has to send a request's headers (and a JSON body: else
# 408); also the idle time before a keep-alive connection is closed.
header_read = 30.0
# After SIGTERM: seconds still accepting connections, /ready answering 503.
drain_delay = 0.0
# Then seconds for open requests to finish.
shutdown_grace = 10.0

[views]
# The views' folder ("" = no views; must be readable at start). A view NAME
# (1-64 of a-z 0-9 _ -) = NAME.include.txt (allows only these ids) and / or
# NAME.exclude.txt (never returns them), one id per line; a request picks it
# with "view": "NAME", a request without view gets the whole model. Dot-files
# and other names are ignored; symlinks are followed (a mounted ConfigMap).
dir = ""
# Seconds between scans of the folder (0 = read at start only, else at least
# 0.1): new and changed views are served from the next request on, a view
# whose files are gone two scans in a row is removed.
reload_interval = 10.0
# Views served at most (each holds one bit per model item); more are skipped
# and logged.
max_views = 1024
