[package]
name = "similaripy-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_similaripy_rs"
crate-type = ["cdylib"]
# Tested through pytest; without these, `cargo test` would link libpython.
test = false
doctest = false

[dependencies]
similaripy-core = { path = "../similaripy-core" }
numpy = "0.29"
# No extension-module feature: maturin sets PYO3_BUILD_EXTENSION_MODULE.
pyo3 = "0.29"
rayon = "1.12"
