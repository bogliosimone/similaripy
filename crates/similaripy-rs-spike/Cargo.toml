[package]
name = "similaripy-rs-spike"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "similaripy_rs_spike"
crate-type = ["cdylib"]

[dependencies]
similaripy-core = { path = "../similaripy-core" }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
rayon = "1.12"
