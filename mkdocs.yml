site_name: SimilariPy
repo_url: https://github.com/bogliosimone/similaripy
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - palette.toggle   # enables Dark/Light mode switch
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_signature: true
            show_signature_annotations: true
            signature_crossrefs: false
            show_root_heading: true
            show_root_full_path: false
            separate_signature: true
            unwrap_annotated: true

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: false
      guess_lang: false
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.details

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: guide.md
  - User guide:
      - Similarities: similarity.md
      - Serving: serving.md
      - Normalizations: normalization.md
      - Signed Input: signed-input.md
  - API reference:
      - similaripy.similarity: api/similarity.md
      - similaripy.serving: api/serving.md
      - similaripy.normalization: api/normalization.md
  - About:
      - Migration from 0.7.0: migration.md
