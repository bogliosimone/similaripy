# cargo-deny (supply-chain CI job): RustSec advisories, licenses, sources.
[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# Every license in the dependency tree today; a new one fails the job for review
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "Unicode-3.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# path deps between the workspace crates (similaripy-py is publish = false)
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
