[project]
name = "similaripy"
version = "0.7.0"
description = "High-performance KNN similarity functions in Python, optimized for sparse matrices"
authors = [{ name = "Simone Boglio", email = "bogliosimone@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "Similarity", "KNN", "Nearest Neighbors",
  "Collaborative Filtering", "Normalization", "Recommender Systems"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Rust",
]
dependencies = [
    "numpy>=1.22.4",
    "scipy>=1.12.0",
]

[project.urls]
homepage = "https://github.com/bogliosimone/similaripy"
documentation = "https://bogliosimone.github.io/similaripy/"
repository = "https://github.com/bogliosimone/similaripy.git"
changelog = "https://github.com/bogliosimone/similaripy/releases"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/similaripy-py/Cargo.toml"
module-name = "similaripy._core"
include = [
  { path = "tests/**/*", format = "sdist" },
  { path = "rust-toolchain.toml", format = "sdist" },
]
exclude = [
  { path = "tests/benchmarks/**/*", format = "sdist" },
  { path = "**/__pycache__/**/*", format = "sdist" },
  { path = "**/.DS_Store", format = "sdist" },
]

[tool.uv]
# Rebuild the editable install when the Rust sources change
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "crates/**/*.rs" },
  { file = "crates/**/Cargo.toml" },
]

[tool.cibuildwheel]
# Python range comes from requires-python, free-threaded (t) builds included
skip = "*-musllinux_* *-win32 *_i686"
test-requires = ["pytest"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
# manylinux images have no Rust: install rustup, then the rust-toolchain.toml pin
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none && cd {project} && $HOME/.cargo/bin/rustup toolchain install"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
# Runner images ship Homebrew GCC; install it only if an image stops doing so
before-all = 'ls "$(brew --prefix)"/bin/g++-* >/dev/null 2>&1 || brew install gcc'
# Homebrew GCC runtime libs (bundled by delocate) require the runner's macOS version
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0" }

[project.optional-dependencies]
dev = [
  "maturin",
  "pytest",
  "build",
  "tox",
  "mkdocs",
  "mkdocs-material",
  "mkdocs-material-extensions",
  "mkdocstrings[python]"
]

bench = [
  "pandas",
  "datasets"
]

notebook = [
  "jupyterlab",
  "matplotlib",
  "seaborn",
  "pandas",
  "optuna",
  "umap-learn",
  "scikit-learn",
  "IProgress"
]

[tool.tox]
requires = ["tox>=4.19"]
