[project]
name = "similaripy"
version = "0.7.0"
description = "High-performance KNN similarity functions in Python, optimized for sparse matrices"
authors = [{ name = "Simone Boglio", email = "bogliosimone@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "Similarity", "KNN", "Nearest Neighbors",
  "Collaborative Filtering", "Normalization", "Recommender Systems"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading :: 3 - Stable",
  "Programming Language :: Rust",
  "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23.5",
    "scipy>=1.15.0",
]

[project.urls]
homepage = "https://github.com/bogliosimone/similaripy"
documentation = "https://bogliosimone.github.io/similaripy/"
repository = "https://github.com/bogliosimone/similaripy.git"
changelog = "https://github.com/bogliosimone/similaripy/releases"

[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/similaripy-py/Cargo.toml"
module-name = "similaripy._core"
include = [
  { path = "tests/**/*", format = "sdist" },
  { path = "rust-toolchain.toml", format = "sdist" },
]
exclude = [
  { path = "**/__pycache__/**/*", format = "sdist" },
  { path = "**/.DS_Store", format = "sdist" },
]

[tool.uv]
# Rebuild the editable install when the Rust sources change
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "crates/**/*.rs" },
  { file = "crates/**/Cargo.toml" },
]

[tool.cibuildwheel]
# Python range comes from requires-python, free-threaded (t) builds included;
# musllinux (Alpine) too, on the same Linux runners as manylinux
skip = "*-win32 *_i686"
test-groups = ["test"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
# manylinux/musllinux images have no Rust: install rustup, then the rust-toolchain.toml pin
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none && cd {project} && $HOME/.cargo/bin/rustup toolchain install"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[[tool.cibuildwheel.overrides]]
# rustc's minimum for x86_64 macOS is 10.12; cibuildwheel's default (10.9 on
# older Pythons) makes delocate reject the wheel. arm64 keeps the default 11.0.
select = "*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.12" }

[dependency-groups]
# Not published (unlike extras): `uv sync --all-groups` (make install-dev), `uv run --group bench …`
# Exact pins for the linters: their rules and diagnostics change between releases.
# Bumped by hand (Dependabot isn't set up for Python deps: no committed uv.lock)
lint = [
  "ruff==0.17.1",
  "ty==0.0.90",
  "scipy-stubs",
]
# What every test run installs: CI jobs, wheel tests (cibuildwheel test-groups), sdist test
test = [
  "pytest",
  "hypothesis",
]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  "maturin",
  "pre-commit",
]
# Zensical (the Material for MkDocs successor) reads mkdocs.yml. Exact pins, bumped by hand
# like the linters: a release can break the strict build. ghp-import: the gh-pages deploy
docs = [
  "zensical==0.0.70",
  "mkdocstrings[python]==1.0.7",
  "mkdocstrings-python==2.0.9",
  "ghp-import==2.1.0",
]
bench = [
  "pandas",
  "datasets",
]
notebook = [
  "jupyterlab",
  "matplotlib",
  "seaborn",
  "pandas",
  "optuna",
  "umap-learn",
  "scikit-learn",
  "ipywidgets",
]

[tool.ty.src]
include = ["similaripy"]

[tool.ruff]
# The width the code is written at; double quotes (the formatter's default)
line-length = 120

[tool.ruff.lint]
# ruff's default rules + a docstring on every public function (the library;
# tests and notebooks exempt)
extend-select = ["D103"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103"]
"benchmarks/**" = ["D103"]  # scripts, not the library
"notebooks/**" = ["D103", "BLE001"]  # demo code: a broad except around a plot is fine
